<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>漫流星核 AI 漫剧前期创作台</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei", sans-serif;
        }
        body {
            background: #121217;
            color: #eee;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header {
            padding: 14px 20px;
            background: #1b1b26;
            border-bottom: 1px solid #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        h1 {
            font-size: 20px;
            color: #7dd3fc;
        }
        .skill-bar {
            padding: 12px 20px;
            background: #171720;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }
        .skill-btn {
            padding: 8px 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }
        .skill-active {
            background: #2563eb;
            color: white;
        }
        .skill-normal {
            background: #272735;
            color: #fff;
        }
        .new-chat-btn {
            margin-left: 20px;
            background: #047857;
            color: white;
        }
        .param-panel {
            padding: 10px 20px;
            background: #15151f;
            display: flex;
            gap: 18px;
            flex-wrap: wrap;
            align-items: center;
            font-size: 13px;
        }
        .param-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .param-item input[type="range"] {
            width: 140px;
        }
        .chat-container {
            flex: 1;
            padding: 16px 20px;
            overflow-y: auto;
        }
        .chat-bubble {
            margin-bottom: 16px;
            max-width: 900px;
            white-space: pre-wrap;
        }
        .user-msg {
            color: #a7f3d0;
        }
        .ai-msg {
            color: #fef3c7;
        }
        .file-list-area {
            padding: 10px 20px;
            background: #14141c;
        }
        .file-item {
            display: inline-block;
            padding: 4px 8px;
            background: #222;
            border-radius: 4px;
            margin: 4px;
            cursor: pointer;
            font-size: 13px;
            color: #93c5fd;
        }
        .input-area-wrap {
            padding: 14px 20px;
            border-top: 1px solid #2c2c3a;
            background: #181822;
        }
        .input-row {
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }
        textarea {
            flex: 1;
            min-height: 70px;
            max-height: 160px;
            background: #222230;
            color: #fff;
            border: 1px solid #383848;
            border-radius: 8px;
            padding: 10px;
            font-size: 14px;
            resize: vertical;
        }
        .btn-group-left {
            display: flex;
            gap: 8px;
        }
        button {
            padding: 9px 14px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }
        .btn-stop {
            background: #b91c1c;
            color: white;
        }
        .btn-pause {
            background: #b45309;
            color: white;
        }
        .btn-send {
            background: #2563eb;
            color: white;
        }
        .btn-upload {
            background: #313144;
            color: white;
        }
        .copy-btn {
            margin-top: 6px;
            background: #334155;
            color: white;
            font-size: 12px;
            padding: 4px 8px;
        }
        .hint-text {
            font-size: 13px;
            color: #9ca3af;
            margin-top: 6px;
        }
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.75);
            z-index: 99;
            align-items: center;
            justify-content: center;
        }
        .modal-box {
            width: 650px;
            max-height: 75vh;
            background: #1b1b26;
            padding: 20px;
            border-radius: 10px;
            overflow-y: auto;
        }
        .modal-close {
            margin-top: 12px;
            background: #374151;
            color: white;
        }
    </style>
</head>
<body>
    <header>
        <h1>漫流星核 AI 漫剧前期创作台</h1>
        <span class="hint-text">网页公开 · 技能接口受白名单管控</span>
    </header>

    <div class="skill-bar">
        <button class="skill-btn skill-normal" onclick="loadSkill('A')">漫剧创作助手 V5</button>
        <button class="skill-btn skill-normal" onclick="loadSkill('B')">导演分镜助手 V5</button>
        <button class="skill-btn skill-normal" onclick="loadSkill('C')">美术画风助手 V5</button>
        <button class="skill-btn new-chat-btn" onclick="newChatTab()">新建对话（新开标签）</button>
    </div>

    <div class="param-panel">
        <div class="param-item">
            <label>脑洞大小：</label>
            <input type="range" id="tempVal" min="0" max="1" step="0.05" value="0.7">
            <span id="tempShow">0.7</span>
        </div>
        <div class="param-item">
            <label>画面范围：</label>
            <input type="range" id="topPVal" min="0" max="1" step="0.05" value="0.85">
            <span id="topPShow">0.85</span>
        </div>
        <div class="param-item">
            <label>上下文 Token：</label>
            <select id="ctxLen">
                <option value="8192">8K</option>
                <option value="16384" selected>16K</option>
                <option value="32768">32K</option>
                <option value="65536">64K</option>
                <option value="131072">128K</option>
                <option value="262144">256K</option>
            </select>
        </div>
    </div>

    <div class="file-list-area">
        <button class="btn-upload" onclick="document.getElementById('fileInput').click()">+ 载入剧本文件</button>
        <input type="file" id="fileInput" accept=".txt,.docx" hidden>
        <div id="loadedFileList"></div>
    </div>

    <div class="chat-container" id="chatBox"></div>

    <div class="input-area-wrap">
        <div class="input-row">
            <div class="btn-group-left">
                <button class="btn-pause" id="pauseBtn" onclick="togglePause()">暂停</button>
                <button class="btn-stop" onclick="stopGenerate()">停止生成</button>
            </div>
            <textarea id="userInput" placeholder="在这里输入你的提示词 / 指令..."></textarea>
            <button class="btn-send" onclick="sendChat()">开始</button>
        </div>
    </div>

    <div class="modal" id="fileViewModal">
        <div class="modal-box">
            <pre id="fileViewContent" style="white-space:pre-wrap; color:#ddd;"></pre>
            <br>
            <button class="modal-close" onclick="closeFileModal()">关闭</button>
        </div>
    </div>

    <script>
        // ========= 配置区，按需修改 =========
        const SKILL_API_BASE = "https://skill-api.manflows.com/api/get-skill";
        const LLAMA_SERVER_URL = "http://127.0.0.1:8080/v1/chat/completions";

        let currentSkill = null;
        let currentSkillText = "";
        let abortController = null;
        let isPaused = false;
        let loadedFiles = [];

        // 同步滑块显示
        document.getElementById("tempVal").oninput = () => {
            document.getElementById("tempShow").textContent = document.getElementById("tempVal").value;
        };
        document.getElementById("topPVal").oninput = () => {
            document.getElementById("topPShow").textContent = document.getElementById("topPVal").value;
        };

        // 加载技能（互斥）
        async function loadSkill(skillId) {
            currentSkill = skillId;
            const resp = await fetch(`${SKILL_API_BASE}?id=${skillId}`);
            if (!resp.ok) {
                alert("获取技能失败：不在白名单或后端异常");
                return;
            }
            currentSkillText = await resp.text();
            addSystemMsg(`✅ 技能【${skillId === 'A' ? '漫剧创作助手 V5' : skillId === 'B' ? '导演分镜助手 V5' : '美术画风助手 V5'}】加载完成`);
        }

        // 文件上传
        document.getElementById("fileInput").onchange = async (e) => {
            const f = e.target.files[0];
            if (!f) return;
            const reader = new FileReader();
            reader.onload = async (ev) => {
                let content = ev.target.result;
                loadedFiles.push({ name: f.name, text: content });
                renderFileList();
            };
            reader.readAsText(f);
        };

        function renderFileList() {
            const wrap = document.getElementById("loadedFileList");
            wrap.innerHTML = "";
            loadedFiles.forEach((item, idx) => {
                const el = document.createElement("span");
                el.className = "file-item";
                el.textContent = item.name;
                el.onclick = () => openFileModal(item.text);
                wrap.appendChild(el);
            });
        }

        function openFileModal(txt) {
            document.getElementById("fileViewContent").textContent = txt;
            document.getElementById("fileViewModal").style.display = "flex";
        }
        function closeFileModal() {
            document.getElementById("fileViewModal").style.display = "none";
        }

        // 新增对话窗口
        function newChatTab() {
            window.open(window.location.href, "_blank");
        }

        // 追加消息
        function addUserMsg(text) {
            const box = document.getElementById("chatBox");
            const div = document.createElement("div");
            div.className = "chat-bubble user-msg";
            div.textContent = `【用户】：${text}`;
            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
        }
        function addSystemMsg(text) {
            const box = document.getElementById("chatBox");
            const div = document.createElement("div");
            div.className = "chat-bubble";
            div.style.color = "#a5b4fc";
            div.textContent = text;
            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
        }
        function createAiBubble() {
            const box = document.getElementById("chatBox");
            const div = document.createElement("div");
            div.className = "chat-bubble ai-msg";
            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
            return div;
        }

        // 暂停 / 继续
        function togglePause() {
            isPaused = !isPaused;
            document.getElementById("pauseBtn").textContent = isPaused ? "继续" : "暂停";
        }

        // 停止生成
        function stopGenerate() {
            if (abortController) abortController.abort();
            abortController = null;
        }

        // 发送消息，流式，修复 TextDecoder("utf8")
        async function sendChat() {
            const userText = document.getElementById("userInput").value.trim();
            if (!userText) return;
            addUserMsg(userText);
            document.getElementById("userInput").value = "";

            const temp = parseFloat(document.getElementById("tempVal").value);
            const topP = parseFloat(document.getElementById("topPVal").value);
            const ctx = parseInt(document.getElementById("ctxLen").value);

            const messages = [];
            if (currentSkillText) {
                messages.push({ role: "system", content: currentSkillText });
            }
            // 把载入文件内容一并带入上下文
            const fileMerge = loadedFiles.map(f => `【文件：${f.name}】\n${f.text}`).join("\n\n");
            const finalUserContent = fileMerge ? `${fileMerge}\n\n用户指令：${userText}` : userText;
            messages.push({ role: "user", content: finalUserContent });

            abortController = new AbortController();
            const aiDom = createAiBubble();
            let fullResp = "";

            try {
                const res = await fetch(LLAMA_SERVER_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        model: "local",
                        messages,
                        temperature: temp,
                        top_p: topP,
                        max_tokens: ctx,
                        stream: true
                    }),
                    signal: abortController.signal
                });
                if (!res.ok) throw new Error("后端请求失败");
                const reader = res.body.getReader();
                // 修复点：使用 utf8，不带横杠
                const decoder = new TextDecoder("utf8");

                while (true) {
                    if (isPaused) {
                        await new Promise(r => setTimeout(r, 200));
                        continue;
                    }
                    const { done, value } = await reader.read();
                    if (done) break;
                    const chunk = decoder.decode(value, { stream: true });
                    const lines = chunk.split("\n");
                    for (const line of lines) {
                        if (!line.startsWith("data: ")) continue;
                        const raw = line.slice(6).trim();
                        if (raw === "[DONE]") continue;
                        try {
                            const j = JSON.parse(raw);
                            if (j.choices?.[0]?.delta?.content) {
                                fullResp += j.choices[0].delta.content;
                                aiDom.textContent = `【AI】：${fullResp}`;
                                document.getElementById("chatBox").scrollTop = document.getElementById("chatBox").scrollHeight;
                            }
                        } catch (e) {}
                    }
                }
                // 复制按钮
                const copyBtn = document.createElement("button");
                copyBtn.className = "copy-btn";
                copyBtn.textContent = "一键复制内容";
                copyBtn.onclick = () => navigator.clipboard.writeText(fullResp);
                aiDom.appendChild(copyBtn);
            } catch (err) {
                addSystemMsg(`❌ 请求异常：${err.message}`);
            }
            abortController = null;
        }
    </script>
</body>
</html>
